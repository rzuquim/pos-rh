            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 8 8;
            fill: none;
            }
            /* Pastel Level Colors */
            .bg-l1 { fill: #FFD1BA; } /* Peach */
            .bg-l2 { fill: #FFF2B2; } /* Yellow */
            .bg-l3 { fill: #B2F0E6; } /* Mint */
